[package]
authors = ["Bjarke Falch Sørensen <bs@wasd.dk>"]
name = "minesweeper-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.17", default-features = false, features = ["std", "async_executor", "bevy_winit", "bevy_ui_render", "default_font", "multi_threaded", "x11"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
ttf-parser = "0.25"
